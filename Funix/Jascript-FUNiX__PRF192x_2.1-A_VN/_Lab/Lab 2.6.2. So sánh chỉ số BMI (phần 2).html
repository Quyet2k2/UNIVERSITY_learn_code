    <!-- Lab 2.6.2. So sánh chỉ số BMI (phần 2)

        Sử dụng ví dụ về BMI từ Lab 2.6.1 và code bạn đã viết để cải thiện lại.

        1. Nhiệm vụ của bạn:

          In một output tốt ra console, hiển thị ai có chỉ số BMI cao hơn. Thông báo hiển thị sẽ là 
          "Mark's BMI is higher than John's!"  hoặc "John's BMI is higher than Mark's!".
          Sử dụng template literal bao gồm các giá trị BMI trong output. 
          Ví dụ: "Mark's BMI (28.3) is higher than John's (23.9)!”.
          Gợi ý: Sử dụng câu lệnh if/else.

    <script>
      // const massMark = 78;

      const massMark = 95;
      const heightMark = 1.88;
      const massJohn = 85;
      const heightJohn = 1.76;

      const MarkBMI = massMark / heightMark ** 2;
      const JohnBMI = massJohn / heightJohn ** 2;
      const markHigherBMI = MarkBMI > JohnBMI;
      console.log(MarkBMI, JohnBMI, markHigherBMI);

      if (MarkBMI > JohnBMI) {
        console.log("Mark's BMI is higher than John's!");
      } else {
        console.log("John's BMI is higher than Mark's!");
      }

      if (MarkBMI > JohnBMI) {
        console.log(
          `Mark's BMI (${MarkBMI}) is higher than John's (${JohnBMI})!`
        );
      } else {
        console.log(
          `John's BMI (${JohnBMI} is higher than Mark's (${MarkBMI})!`
        );
      }
