    <!-- Lab 6. Xử lý chuỗi

Cho một loạt các nhiệt độ tối đa đã được dự báo, nhiệt kế hiển thị một string với các nhiệt độ đã cho. 
Ví dụ: [17, 21, 23] sẽ in ra console "... 17ºC in 1 day ... 21ºC in 2 days ... 23ºC in 3 days ..."

1. Nhiệm vụ của bạn

Tạo hàm 'printForecast' lấy array 'arr' và in một string như trên ra console. Hãy thực hành với cả hai dữ liệu kiểm tra.
2. Dữ liệu kiểm tra

Dữ liệu 1: [17, 21, 23]
Dữ liệu 2: [12, 5, -5, 0, 4]
Lưu ý: 

Sau khi hoàn thành bài lab ở trên, học viên lưu lại file bài làm trên máy tính cá nhân để phục vụ cho việc review lab sau này. 
Học viên cần hoàn thành tất cả các bài lab của môn học mới tiến hành đăng ký review.

Thời gian cần thiết để hoàn thành: 15 phút -->

    <script>
      //
      const printForecast = (arr) => {
        let str = `... ${arr[0]}ºC in ${1} day ... `;
        for (let i = 1; i < arr.length; i++) {
          str += `${arr[i]}ºC in ${i + 1} days ... `;
        }

        console.log(str);
      };

      printForecast([17, 21, 23]);
      printForecast([12, 5, -5, 0, 4]);
    </script>
