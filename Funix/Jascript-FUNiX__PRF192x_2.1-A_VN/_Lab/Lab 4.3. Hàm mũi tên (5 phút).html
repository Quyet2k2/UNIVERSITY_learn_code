    <!-- Lab 4.3. Hàm mũi tên (5 phút)

Thực hiện lại bài lab trước, nhưng lần này hãy tạo một hàm mũi tên là 'percentageOfWorld3'. -->
    <script>
      const percentageOfWorld3 = (population) => (population / 7900) * 100;

      const china = `${"Trung Quốc"} có ${1441 / 1000} tỷ người, chiếm 
        ${percentageOfWorld3(1441)}% dân số thế giới`;
      const vietNam = `${"Việt Nam"} có ${100} triệu người, chiếm 
        ${percentageOfWorld3(100)}% dân số thế giới`;
      const england = `${"England"} có ${66} triệu người, chiếm 
        ${percentageOfWorld3(66)}% dân số thế giới`;

      console.log(china);
      console.log(vietNam);
      console.log(england);
    </script>
  </body>
