    <!-- Lab 5.2. Dấu chấm với dấu ngoặc (10 phút)

Sử dụng object từ bài tập trước, in string sau ra console: 'Finland has 6 million finnish-speaking people, 3 neighbouring countries and a capital called Helsinki.'
Tăng dân số của đất nước thêm hai triệu người bằng cách sử dụng dấu chấm (object.population), và sau đó giảm đi hai triệu người bằng dấu ngoặc (object['population']) để truy cập vào các thuộc tính.  -->
    <script>
      //
      const myCountry = {
        country: "Finland",
        capital: "Helsinki",
        language: "finnish",
        population: 6,
        neighbours: ["Thụy Điển", "Na Uy", "Nga"],

        getlog: function () {
          // 'Finland has 6 million finnish-speaking people, 3 neighbouring countries and a capital called Helsinki.'
          return `${this.country} has ${this.population} million ${this.language}-speaking people, ${this.neighbours.length} neighbouring countries and a capital called ${this.capital}.'`;
        },

        plus2_population: function () {
          return `${this.country} has ${this.population + 2} million ${
            this.language
          }-speaking people, ${
            this.neighbours.length
          } neighbouring countries and a capital called ${this.capital}.'`;
        },

        reduce2_population: function () {
          return `${this.country} has ${this["population"] - 2} million ${
            this.language
          }-speaking people, ${
            this.neighbours.length
          } neighbouring countries and a capital called ${this.capital}.'`;
        },
      };

      //   console.log(myCountry.getlog());
      //   console.log(myCountry.plus2_population());
      //   //   console.log(myCountry.population); // = 6 không thay đổi
      //   console.log(myCountry.reduce2_population());

      console.log(
        `${myCountry.country} has ${myCountry.population} million ${myCountry.language}-speaking people, ${myCountry.neighbours.length} neighbouring countries and a capital called ${myCountry.capital}.'`
      );
      console.log(
        `${myCountry.country} has ${myCountry.population + 2} million ${
          myCountry.language
        }-speaking people, ${
          myCountry.neighbours.length
        } neighbouring countries and a capital called ${myCountry.capital}.'`
      );
      console.log(
        `${myCountry.country} has ${myCountry["population"] - 2} million ${
          myCountry.language
        }-speaking people, ${
          myCountry.neighbours.length
        } neighbouring countries and a capital called ${myCountry.capital}.'`
      );
    </script>
  </body>
