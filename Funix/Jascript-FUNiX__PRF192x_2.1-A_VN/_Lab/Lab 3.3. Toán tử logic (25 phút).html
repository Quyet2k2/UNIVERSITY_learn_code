    <!-- Lab 3.3. Toán tử logic (25 phút)

        1. Hãy vô hiệu hóa code trước đó để prompt không xuất hiện.

        2. Giả sử Sarah đang tìm một quốc gia mới để sinh sống. 
        Cô ấy muốn ở một đất nước sử dụng ngôn ngữ Tiếng Anh, 
        dân số ít hơn 50 triệu người và không phải đảo quốc.

        3. Bạn cần tạo các biến tương ứng với tên đất nước, ngôn ngữ, dân số, 
        có phải đảo quốc không. Giá trị các biến này sẽ được nhập bằng hàm prompt.
        
        4. Hãy viết một câu lệnh if giúp Sarah tìm kiếm quốc gia phù hợp. 
        Bạn cần viết điều kiện đánh giá  tất cả các tiêu chí của Sarah. 
        Hãy dành thời gian thực hiện điều này.
        
        5. Nếu đất nước nhập vào phù hợp, in ra string như sau: 
        'You should live in <tên đất nước> :)'. Ngược lại, 
            hãy in '<tên đất nước> does not meet your criteria :(' -->
    <script>
      // 1, 2, 3
      const country = prompt("Mời nhập tên quốc gia!");
      const language = String(prompt("Nhập ngôn ngữ!"));
      const population = Number(
        prompt("Nhập số lượng dân số! (là số với đơn vị triệu dân.)")
      );
      const isIsland =
        prompt("Có phải là đảo không? (có | không)") === "có" ? true : false;

      //   console.log(country, language, population, isIsland);

      // 4 5
      if (language === "english" && population < 50 && !isIsland)
        console.log(`You should live in ${country} :)`);
      else console.log(`${country} does not meet your criteria :('`);
    </script>
