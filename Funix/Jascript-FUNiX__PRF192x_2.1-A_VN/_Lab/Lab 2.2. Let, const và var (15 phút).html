    <!-- Lab 2.2. Let, const và var (15 phút)

      1. Đặt giá trị của 'language' thành ngôn ngữ được nói ở nơi bạn sống 
          (một số quốc gia có nhiều ngôn ngữ, nhưng chỉ cần chọn một). Ví dụ như 'English', 'Vietnamese'.

      2. Hãy nghĩ xem những biến nào có thể sử dụng const 
          (những giá trị nào không bao giờ thay đổi, và những giá trị nào có thể thay đổi?). 
          Sau đó, chuyển các biến mà bạn đã nghĩ ra thành biến khai báo bằng const.

      3. Giờ hãy thử thay đổi giá trị một trong các biến trên và quan sát xem điều gì sẽ xảy ra. -->
    <script>
      const country = "VietNam";
      const continent = "Asia";
      let population = 100;

      console.log(typeof country);
      console.log(typeof continent);
      console.log(typeof population);

      ////////////////////// Lab 2.1
      const isIsland = false;
      const language = "Vietnamese";
      console.log(typeof isIsland);
      console.log(typeof language);

      ////////////////////// Lab 2.2
      // country = "VietNam";
      // continent = "Asia";
      population = 100;
      // isIsland = false;
      // language = "Vietnamese";
    </script>
