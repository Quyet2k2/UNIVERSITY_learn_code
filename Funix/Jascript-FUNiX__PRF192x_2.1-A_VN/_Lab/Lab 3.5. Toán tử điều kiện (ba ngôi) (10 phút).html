    <!-- Lab 3.5. Toán tử điều kiện (ba ngôi) (10 phút)

        Nếu dân số của đất nước lớn hơn 33 triệu người, 
        sử dụng toán tử ba ngôi để in string sau ra console: 
        'Portugal's population is above average'. Ngược lại, 
        hãy in 'Portugal's population is below average'. 
        Lưu ý giữa hai câu này chỉ có một từ thay đổi!

        Sau khi kiểm tra kết quả, hãy tạm thay đổi dân số 
        thành 13 rồi thành 130. Hãy xem xét các kết quả khác nhau, 
        rồi đặt dân số về lại ban đầu.

        Lưu ý: Sau khi hoàn thành bài lab ở trên, học viên lưu lại file 
        bài làm trên máy tính cá nhân để phục vụ cho việc review lab sau này. 
        Học viên cần hoàn thành tất cả các bài lab của môn học mới tiến hành 
        đăng ký review. -->
    <script>
      //   const population = 13;
      const population = 130;
      population > 33
        ? console.log("Portugal's population is above average")
        : console.log("'Portugal's population is below average'.");
    </script>
