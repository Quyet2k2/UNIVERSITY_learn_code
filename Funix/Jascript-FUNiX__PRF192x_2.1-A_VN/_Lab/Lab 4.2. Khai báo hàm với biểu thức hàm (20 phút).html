  <body>
    <!-- https://courses.funix.edu.vn/courses/course-v1:FUNiX+PRF192x_2.1-A_VN+2022_T3/courseware/4b263362f9ec4edf9f901a195177a213/a1aa69dc337f4b8bbacfe6694c0f6d6d/?child=first#:~:text=Lab%204.4.%C2%A0H%C3%A0m%20g%E1%BB%8Di%20h%C3%A0m%20(15%20ph%C3%BAt) -->
    <!-- Lab 4.2. Khai báo hàm với biểu thức hàm (20 phút)

Dân số thế giới là 7.9 tỷ người. Tạo khai báo hàm 'percentageOfWorld1' nhận một giá trị 'population' và trả về phần trăm dân số thế giới theo dân số đã cho. Ví dụ: Trung Quốc có 1.441 tỷ người, chiếm 18.2% dân số thế giới.
Để tính phần trăm, chia giá trị 'population' đã biết cho 7900 rồi nhân với 100.
Gọi 'percentageOfWorld1' cho 3 dân số của các quốc gia bất kỳ, lưu kết quả vào các biến và in chúng ra console.
Tạo biểu thức hàm thực hiện điều tương tự, gọi là 'percentageOfWorld2' và cũng gọi nó với 3 dân số theo quốc gia (có thể có cùng số dân). -->
    <script>
      //
      function percentageOfWorld1(population) {
        return (population / 7900) * 100;
      }

      const china = `${"Trung Quốc"} có ${1441 / 1000} tỷ người, chiếm
        ${percentageOfWorld1(1441)}% dân số thế giới`;
      const vietNam = `${"Việt Nam"} có ${100} triệu người, chiếm
        ${percentageOfWorld1(100)}% dân số thế giới`;
      const england = `${"England"} có ${66} triệu người, chiếm
        ${percentageOfWorld1(66)}% dân số thế giới`;

      console.log(china);
      console.log(vietNam);
      console.log(england);

      console.log("======================");

      const percentageOfWorld2 = function (population) {
        return (population / 7900) * 100;
      };

      const china2 = `${"Trung Quốc"} có ${1441 / 1000} tỷ người, chiếm
        ${percentageOfWorld2(1441)}% dân số thế giới`;
      const vietNam2 = `${"Việt Nam"} có ${100} triệu người, chiếm
        ${percentageOfWorld2(100)}% dân số thế giới`;
      const england2 = `${"England"} có ${66} triệu người, chiếm
        ${percentageOfWorld2(66)}% dân số thế giới`;

      console.log(china);
      console.log(vietNam);
      console.log(england);
    </script>
  </body>
